<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Declaração de amor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Yellowtail&display=swap" rel="stylesheet">
</head>
<body>
    
    <div class="musicPlayer">
        <button class="playPauseBtn" onclick="toggleMusic()">▶️</button>
        <audio id="musica" src="contents/sound/music.mp3"></audio>
    </div>

    <h1>📸❤️ Com amor ❤️📸</h1>

    <div class="centraliza">
        <button onclick="voltarImagem()">⬅️</button>

        <div class="polaroid" id="polaroid" onclick="revelarImagem()">
            <div class="foto">
                <img id='fotosPolaroid' src="" alt="Imagem polaroid">
            </div>
            <div id="texto" class="verso"></div>
        </div>
        <button onclick="avancarImagem()">➡️</button>
    </div>
    <div class="legenda">Por @jimmykiedis</div>

    <script src="script.js"></script>
</body>

</html>
